[project]
name = "coffee-leaf-disease-yolov8"
version = "2.1.0"
description = "YOLOv8 object detection for coffee leaf disease, served as a Flask web app."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Glen Devit Renaldi" }]
keywords = ["yolov8", "object-detection", "coffee", "plant-disease", "flask", "opencv"]
classifiers = [
  "Topic :: Scientific/Engineering :: Image Recognition",
  "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
]

dependencies = [
  "Flask>=3.0,<4.0",
  "numpy>=1.26",
  "opencv-python>=4.9",
  "onnxruntime>=1.18",
  "ultralytics>=8.3,<9.0",
  "gunicorn>=22.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11"]
# Only needed to produce models/best.onnx from the checkpoint.
export = ["onnx>=1.16", "onnxslim>=0.1.82"]

[project.urls]
Homepage = "https://github.com/glen1599/coffee-leaf-disease-yolov8"
Issues = "https://github.com/glen1599/coffee-leaf-disease-yolov8/issues"

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
files = ["app.py", "coffee_leaf"]

# Ultralytics ships no type stubs and types its predictor as a union of every
# backend. Treat it as Any rather than fighting incomplete third-party types.
[[tool.mypy.overrides]]
module = ["ultralytics.*"]
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
